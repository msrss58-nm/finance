<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyFinance — Cockpit (Preview v2)</title>
<style>
    :root {
        --color-bg: #f4f5f7;
        --color-surface: #ffffff;
        --color-border: #e5e7eb;
        --color-text: #16181d;
        --color-text-muted: #6b7280;
        --color-primary: #0a7d3d;
        --color-primary-dark: #066b32;
        --color-danger: #c0392b;
        --color-warning: #b45309;
        --color-warning-bg: #fef3e2;
        --color-primary-bg: #eaf7ef;
        --radius: 14px;
        --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; }

    body {
        font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        margin: 0;
    }

    .app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background: var(--color-bg);
        /* Stage F.1 fix: was 130px, which let the FAB (bottom:88px + 56px tall = its top edge
           sits 144px above the viewport bottom) visually overlap the last content row. 176px
           leaves a clear ~32px gap above the FAB's top edge for any screen's last row. */
        padding-bottom: 176px;
    }

    @media (min-width: 700px) {
        .app-shell { box-shadow: 0 0 40px rgba(0,0,0,.06); }
    }

    /* ===== Header ===== */
    .app-header {
        padding: 22px 20px 14px;
        text-align: center;
    }
    .app-header h1 { font-size: 19px; margin: 0; }
    .app-header .subtitle { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; }

    /* ===== Screens ===== */
    .screen { display: none; padding: 4px 16px 16px; }
    .screen.active { display: block; }

    .section-title { font-size: 15px; font-weight: 700; margin: 22px 0 11px; letter-spacing: -.1px; }
    .section-title:first-child { margin-top: 4px; }

    /* ===== Hero gauge ===== */
    .hero-gauge {
        background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
        color: #fff;
        border-radius: var(--radius);
        padding: 26px 20px;
        text-align: center;
        box-shadow: var(--shadow);
    }
    .hero-gauge .hero-label { font-size: 13px; opacity: .85; }
    /* Stage F.1 follow-up: same bidi isolation as .tx-amount — negative balances rendered as
       "13,050-₪" instead of "-₪13,050" inside the surrounding RTL page. Display-only, value unchanged. */
    .hero-gauge .hero-amount { font-size: 40px; font-weight: 700; margin: 4px 0; direction: ltr; unicode-bidi: isolate; }
    .hero-gauge .status-pill {
        display: inline-block; background: rgba(255,255,255,.2);
        padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 4px;
    }
    /* Version 1.1, Stage 1: hero-narrative removed — the green hero card now shows only the
       label, the amount, and the status pill (the two explanatory "החודש: ..." lines are gone). */

    /* ===== Snapshot ===== */
    /* Version 1.1, Stage 1: the "יתרה" card was removed (balance is already the hero-amount above);
       only income + expenses remain, so this is now a 2-column grid. */
    .snapshot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
    .snapshot-card {
        background: var(--color-surface); border-radius: 12px; padding: 12px 6px;
        text-align: center; box-shadow: var(--shadow);
    }
    .snapshot-card .label { font-size: 10.5px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .3px; }
    .snapshot-card .value { font-size: 15px; font-weight: 700; margin-top: 5px; direction: ltr; unicode-bidi: isolate; }
    .snapshot-card.income .value { color: var(--color-primary); }
    .snapshot-card.expenses .value { color: var(--color-danger); }

    /* ===== Version 1.1, Stage 1: automatic per-category tiles (below income/expenses) ===== */
    .category-tiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .category-tile {
        background: var(--color-surface); border-radius: 12px; padding: 12px 6px;
        text-align: center; box-shadow: var(--shadow);
        cursor: pointer; user-select: none; -webkit-user-select: none;
        /* Lets normal vertical page scrolling start immediately on a tile; only once a genuine
           long-press-without-movement engages drag mode does the JS lock this down to 'none'. */
        touch-action: pan-y;
        transition: transform .12s ease, box-shadow .12s ease;
    }
    .category-tile.dragging {
        opacity: .65; transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,.18);
        position: relative; z-index: 5;
    }
    .category-tile-icon {
        width: 30px; height: 30px; border-radius: 50%; background: #eef2f0;
        display: flex; align-items: center; justify-content: center; font-size: 14px;
        margin: 0 auto 6px;
    }
    .category-tile-label {
        font-size: 10.5px; color: var(--color-text-muted);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .category-tile-value { font-size: 13.5px; font-weight: 700; margin-top: 4px; direction: ltr; unicode-bidi: isolate; }

    /* ===== Version 1.1, Stage 3.5: computed "stat" tiles (יתרת תשלומים שונים / יתרת הלוואות) — =====
       ===== deliberately their own class, NOT .category-tile, so the Stage 1 drag-reorder      =====
       ===== pointerdown handler's `.category-tile` matching (and its index math against          =====
       ===== categoryTileOrder) never sees them — these tiles are not categories and are never     =====
       ===== draggable/reorderable. A few properties are intentionally duplicated from             =====
       ===== .category-tile rather than sharing that selector, to keep this isolation total. Their =====
       ===== .category-tile-icon/-label/-value children reuse those existing classes as-is. */
    .stat-tile {
        background: var(--color-surface); border-radius: 12px; padding: 12px 6px;
        text-align: center; box-shadow: var(--shadow);
        cursor: pointer; user-select: none; -webkit-user-select: none;
    }
    .stat-tile-toggle { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
    .stat-tile-toggle-btn {
        font-size: 9.5px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--color-border);
        background: var(--color-bg); color: var(--color-text-muted); cursor: pointer; font-family: inherit;
    }
    .stat-tile-toggle-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    /* ===== Version 1.1, Stage 1: active category-filter chip on the Transactions screen ===== */
    .category-filter-chip {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        background: var(--color-primary-bg); color: var(--color-primary-dark);
        border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; font-weight: 600;
    }
    .category-filter-chip button {
        background: none; border: none; color: inherit; font-size: 14px; font-weight: 700;
        cursor: pointer; padding: 0 2px; font-family: inherit;
    }

    /* ===== Attention list ===== */
    .attention-item {
        display: flex; justify-content: space-between; align-items: center;
        background: var(--color-warning-bg); border-right: 4px solid var(--color-warning);
        border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    }
    .attention-title { font-size: 13.5px; font-weight: 600; }
    .attention-detail { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
    .attention-amount { font-size: 14px; font-weight: 700; color: var(--color-warning); white-space: nowrap; }

    /* ===== Transaction rows (shared: recent activity + transactions screen) ===== */
    .tx-row {
        display: flex; align-items: center; gap: 12px;
        background: var(--color-surface); border-radius: 12px; padding: 11px 14px;
        margin-bottom: 8px; box-shadow: var(--shadow);
        /* Stage G.2.3: makes .tx-row the containing block for the future .tx-menu-dropdown
           (position: absolute, below) — no visible effect on its own: .tx-row keeps its normal
           place in document flow, and no z-index is set here. */
        position: relative;
    }
    .tx-icon {
        width: 34px; height: 34px; border-radius: 50%; background: #eef2f0;
        display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
    }
    .tx-info { flex: 1; min-width: 0; }
    .tx-title { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-date { font-size: 11.5px; color: var(--color-text-muted); margin-top: 2px; }
    /* Stage F.1 fix: isolates the amount text as its own LTR run so the browser's bidi algorithm
       renders "-₪3,200" in that literal left-to-right order — without this, the leading "-"
       character (a bidi-neutral character) gets visually displaced to the far side inside the
       surrounding RTL page, rendering as "₪3,200-" instead. Pure display fix — the underlying
       string/value built by JS is unchanged. */
    .tx-amount { font-size: 14px; font-weight: 700; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
    .tx-amount.income { color: var(--color-primary); }
    .tx-amount.expense { color: var(--color-danger); }

    /* Stage G.2.3: CSS-only infrastructure for a future per-row actions menu (Stage G.2.4+).
       None of the 3 classes below are referenced by any markup yet — renderTxList()/
       renderTransactionsScreenFromRealData() do not emit a ⋮ button or dropdown in this stage,
       so these rules have zero visible effect anywhere until a later stage adds matching HTML. */

    /* ⋮ toggle button: intended as a 5th flex child appended after .tx-amount inside .tx-row —
       an in-flow item (not absolutely positioned), so it takes its own place in the row's flex
       layout rather than overlapping/hiding .tx-amount, the same way .tx-icon already occupies
       its own place on the row's other end. Sized at 32px — under .tx-icon's 34px, which is what
       currently sets .tx-row's height ceiling — so adding this button cannot increase the row's
       height; .tx-row's own padding is untouched. flex-shrink:0 keeps it from being compressed
       on a narrow row, same as .tx-icon. */
    .tx-menu-toggle {
        width: 32px; height: 32px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: none; border: none; border-radius: 8px; padding: 0; margin: 0;
        font-size: 18px; line-height: 1; color: var(--color-text-muted);
        cursor: pointer; font-family: inherit;
    }
    .tx-menu-toggle:hover, .tx-menu-toggle:focus-visible {
        background: var(--color-bg); color: var(--color-text); outline: none;
    }

    /* Version 1.1, Stage 4.0.2.1: applied only to active-item rows in renderTxListWithActions()
       (never in plain renderTxList()'s Home rows, and never on an archived row — editing stays
       exactly as restricted as before, this only changes how it's triggered). Signals the row
       itself is now the click target for opening its edit form. */
    .tx-row.tx-row-clickable { cursor: pointer; }
    .tx-row.tx-row-clickable:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    /* Dropdown panel: position:absolute removes it from document flow entirely, so its own
       content height can never affect .tx-row's height or push neighboring rows — it simply
       floats over whatever content is already there. top:100% + left:0 anchors it just below
       .tx-row, aligned to the row's LEFT edge — under RTL's flex-direction reversal the ⋮ toggle
       (last flex child) already renders at the row's left edge, so left:0 opens the menu directly
       under the button that triggers it (matches this file's existing convention of physical
       left/right rather than logical inset-inline-* properties — .fab/.bottom-nav do the same).
       display:none by default; a future .open class (Stage G.2.4, not added here — no JS exists
       yet in this stage to toggle it) will control visibility. z-index:10 is enough to paint
       above sibling .tx-row elements (which set no z-index of their own) without competing with,
       or needing to be reasoned about alongside, the page-chrome scale already established
       elsewhere in this file (.bottom-nav:50, .fab:60, .quick-actions-overlay:70) — a per-row
       menu is page content, not global chrome, so it intentionally stays well under those. No
       ancestor of .tx-row (.screen, .app-shell, body) sets overflow:hidden anywhere in this
       file, so this dropdown cannot be clipped regardless of which row it opens from — including
       the last row, where .app-shell's existing 176px bottom padding (Stage F.1) already leaves
       ample clearance below the last row before .bottom-nav's fixed position. min-width:150px
       comfortably fits both action labels ("העבר לארכיון" / "שחזר") plus the item's own
       horizontal padding without wrapping. No new @media query: this app has no desktop-specific
       layout distinct from mobile anywhere in this file (the one existing @media rule only adds
       a box-shadow to .app-shell at >=700px), so none is needed here either. The dropdown's own
       overflow:hidden simply clips its rounded corners against a hovered .tx-menu-item's square
       background — it is not a clipping risk for anything positioned outside the dropdown. */
    .tx-menu-dropdown {
        display: none;
        position: absolute; top: 100%; left: 0; margin-top: 6px;
        min-width: 150px;
        background: var(--color-surface); border: 1px solid var(--color-border);
        border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
        z-index: 10;
        overflow: hidden;
    }
    .tx-menu-dropdown.open { display: block; }

    /* Single action row inside the dropdown — full-width tappable text button, right-aligned to
       match the surrounding RTL page. Deliberately unstyled for a "destructive"/edit look (no
       var(--color-danger), no icon) since edit/delete are out of scope for this stage; both
       "העבר לארכיון" and "שחזר" are simple neutral actions today. */
    .tx-menu-item {
        display: block; width: 100%; text-align: right;
        padding: 10px 14px; background: none; border: none;
        font-size: 13.5px; color: var(--color-text);
        cursor: pointer; font-family: inherit;
    }
    .tx-menu-item:hover, .tx-menu-item:focus-visible {
        background: var(--color-bg); outline: none;
    }
    /* Stage G.3: permanent-delete menu item — same .tx-menu-item base, only the text color
       changes to signal a destructive action (no separate confirm dialog is built; the browser's
       own confirm() handles that, per approved product decision). */
    .tx-menu-item-danger { color: var(--color-danger); }

    /* ===== Stage G.4: inline edit form — replaces a .tx-row entirely while that row's item is
       being edited (Stage G.4 product decision 2א). Deliberately its own class names (not reused
       from index.html's .edit-inside-form/.form-group/.btn-save-edit/.btn-cancel-edit), since this
       file has its own separate design system — only the underlying field ids/behavior mirror
       index.html, not the CSS. */
    .tx-edit-form {
        background: var(--color-surface); border-radius: 12px; padding: 14px;
        margin-bottom: 8px; box-shadow: var(--shadow);
    }
    .tx-edit-group { margin-bottom: 10px; }
    .tx-edit-group label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 4px; }
    .tx-edit-group input, .tx-edit-group select, .tx-edit-group textarea {
        width: 100%; padding: 9px 12px; border: 1px solid var(--color-border);
        border-radius: 10px; font-size: 14px; background: var(--color-bg); font-family: inherit;
    }
    .tx-edit-group textarea { min-height: 56px; resize: vertical; }
    .tx-edit-actions { display: flex; gap: 8px; margin-top: 4px; }
    .tx-edit-save, .tx-edit-cancel {
        flex: 1; padding: 10px; border-radius: 10px; border: none;
        font-size: 13.5px; cursor: pointer; font-family: inherit;
    }
    .tx-edit-save { background: var(--color-primary); color: #fff; }
    .tx-edit-cancel { background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); }

    /* ===== Stage G.5: expense-type picker buttons — shown inside the add-transaction form area
       (#preview-add-form-area) when "הוצאה חדשה" is chosen, before a specific expense type
       (fixed/variable/dated) is picked. The picker itself reuses .tx-edit-form as its wrapping
       card (no new wrapper class); only these 2 rules are new. */
    .expense-type-btn {
        display: block; width: 100%; text-align: right; margin-bottom: 8px;
        padding: 12px 14px; border-radius: 10px; border: 1px solid var(--color-border);
        background: var(--color-bg); font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .expense-type-btn.disabled { opacity: .55; cursor: not-allowed; }

    /* ===== Transactions screen: search + filter (visual only) ===== */
    .search-bar input {
        width: 100%; padding: 10px 14px; border: 1px solid var(--color-border);
        border-radius: 10px; font-size: 14px; background: var(--color-surface); font-family: inherit;
    }
    .filter-toggle { display: flex; gap: 8px; margin: 10px 0 16px; }
    .filter-btn {
        flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--color-border);
        background: var(--color-surface); font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .filter-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    /* ===== Insights ===== */
    .insight-card {
        display: flex; align-items: flex-start; gap: 14px;
        background: var(--color-primary-bg); border-radius: 14px; padding: 16px;
        margin-bottom: 12px; box-shadow: var(--shadow); border-right: 4px solid var(--color-primary);
    }
    .insight-card.warning { background: var(--color-warning-bg); border-right-color: var(--color-warning); }
    .insight-icon {
        width: 38px; height: 38px; border-radius: 50%; background: var(--color-surface);
        display: flex; align-items: center; justify-content: center; font-size: 18px;
        flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .insight-body { flex: 1; min-width: 0; }
    .insight-title { font-size: 11.5px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
    /* Stage F.1 follow-up: same bidi isolation fix as .tx-amount/.hero-amount/.snapshot-card .value
       — the forecast-warning insight card's value can be negative. Display-only, value unchanged. */
    .insight-value { font-size: 21px; font-weight: 800; margin-top: 5px; letter-spacing: -.2px; direction: ltr; unicode-bidi: isolate; }
    .insight-card.warning .insight-value { color: var(--color-warning); }
    .insight-note { font-size: 12.5px; color: var(--color-text); margin-top: 6px; line-height: 1.55; opacity: .82; }

    /* ===== Forecast (Stage 3ב.4): chart/table box, adapted from index.html's .forecast-box for   =====
       ===== this screen's card language (white surface, var(--shadow), var(--radius)) instead of  =====
       ===== index.html's dark theme vars. Bar/zero-line/scale-label geometry and colors (positive  =====
       ===== = primary green, negative = danger red) are unchanged from index.html's own choices.  ===== */
    .preview-forecast-box {
        background: var(--color-surface); border-radius: var(--radius); padding: 16px;
        margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .preview-forecast-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .preview-forecast-toggle-btn {
        padding: 6px 12px; font-size: 12px; background: var(--color-bg);
        border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    .preview-forecast-chart-wrap { position: relative; }
    .preview-forecast-chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
    .preview-forecast-bar { cursor: pointer; }
    .preview-forecast-bar:hover, .preview-forecast-bar:focus { filter: brightness(1.15); outline: none; }
    .preview-forecast-bar-pos { fill: var(--color-primary); }
    .preview-forecast-bar-neg { fill: var(--color-danger); }
    .preview-forecast-zero-line { stroke: var(--color-border); stroke-width: 1; }
    .preview-forecast-axis-label { font-size: 7px; fill: var(--color-text-muted); }
    .preview-forecast-scale-label { font-size: 6px; fill: var(--color-text-muted); }
    .preview-forecast-tooltip {
        position: absolute; background: var(--color-text); color: #fff; border-radius: 8px;
        padding: 5px 9px; font-size: 12px; pointer-events: none; white-space: nowrap;
        transform: translate(-50%, -110%); z-index: 10; display: none;
    }
    .preview-forecast-tooltip strong { display: block; }
    .preview-forecast-table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .preview-forecast-table-wrap td, .preview-forecast-table-wrap th {
        padding: 6px; text-align: center; border-bottom: 1px solid var(--color-border);
    }
    .preview-forecast-table-wrap th { color: var(--color-text-muted); font-weight: 500; font-size: 11.5px; }
    .preview-forecast-positive { color: var(--color-primary); font-weight: 700; }
    .preview-forecast-negative { color: var(--color-danger); font-weight: 700; }

    /* ===== Settings ===== */
    .category-row {
        display: flex; justify-content: space-between; align-items: center;
        background: var(--color-surface); border-radius: 12px; padding: 12px 14px;
        margin-bottom: 8px; box-shadow: var(--shadow);
        /* Version 1.1, Stage 3: the row itself is clickable — it opens the category's own page
           (filterTransactionsByCategory()), same navigation a Home category tile already triggers. */
        cursor: pointer;
    }
    .cat-label { font-size: 14px; }

    /* ===== Stage 3ב.2: category-row action buttons + add-category toggle. Deliberately small,
       dedicated classes (not reused from .tx-edit-save/.tx-edit-cancel, which are sized for a
       full-width two-button action bar) — these sit inline inside a compact .category-row next to
       the label. The rename/add forms themselves still reuse .tx-edit-form/.tx-edit-group/
       .tx-edit-actions/.tx-edit-save/.tx-edit-cancel as-is (same reasoning already applied to the
       add-transaction form in Stage G.5: no visual reason for a separate form class set). */
    .cat-row-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .cat-edit-btn, .cat-delete-btn, .cat-cancel-btn {
        font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--color-border);
        background: var(--color-bg); cursor: pointer; font-family: inherit;
    }
    .cat-delete-btn { color: var(--color-danger); border-color: var(--color-danger); }
    .cat-confirm-delete-btn {
        font-size: 12px; padding: 6px 10px; border-radius: 8px; border: none;
        background: var(--color-danger); color: #fff; cursor: pointer; font-family: inherit;
    }
    .cat-delete-confirm-text { font-size: 12.5px; color: var(--color-danger); }
    .cat-add-toggle {
        display: block; width: 100%; padding: 10px; border-radius: 10px;
        border: 1px dashed var(--color-border); background: var(--color-bg);
        font-size: 13.5px; cursor: pointer; font-family: inherit; margin-top: 4px;
    }

    /* ===== Bottom navigation ===== */
    .bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto;
        background: var(--color-surface); border-top: 1px solid var(--color-border);
        display: flex; justify-content: space-around; padding: 8px 0; z-index: 50;
    }
    .nav-btn {
        background: none; border: none; display: flex; flex-direction: column; align-items: center;
        gap: 3px; font-size: 11px; color: var(--color-text-muted); cursor: pointer;
        padding: 4px 10px; font-family: inherit;
    }
    .nav-btn .nav-icon {
        font-size: 18px; padding: 3px 13px; border-radius: 12px;
        transition: background-color .15s ease;
    }
    .nav-btn.active { color: var(--color-primary); font-weight: 700; }
    .nav-btn.active .nav-icon { background: var(--color-primary-bg); }

    /* ===== Floating quick-add button ===== */
    .fab {
        position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
        width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary);

<script>
    // ===== Stage 4.4 candidate: reads/writes the REAL app's own localStorage keys directly — =====
    // ===== no separate Preview/Real distinction anymore (this file IS the candidate for      =====
    // ===== family_finance_data/family_finance_cat_config). The seed-from-real, reset, and     =====
    // ===== status-line mechanisms that only made sense for an isolated Preview copy have been =====
    // ===== removed entirely (not just neutralized) — there is nothing left to seed from or    =====
    // ===== reset against once this file's own keys ARE the real ones.                         =====
    var DATA_KEY = 'family_finance_data';
    var CONFIG_KEY = 'family_finance_cat_config';

    var DEFAULT_CATEGORY_CONFIG_JSON = JSON.stringify({
        income: { label: "💰 הכנסות", baseType: "income" },
        fixed: { label: "🏡 הוצאות קבועות", baseType: "fixed" },
        variable: { label: "🛒 תשלומים שונים", baseType: "variable" },
        loan: { label: "🏦 הלוואות", baseType: "loan" }
    });

    // ===== Stage B: screen structure + static UI, fed only by MOCK_DATA below. No business logic, no calculations. =====
    var MOCK_DATA = {
        hero: {
            amount: "₪4,320",
            statusLabel: "תמונת מצב חודשית",
            narrative: "יש לך מרווח בטוח החודש. אפשר להמשיך כרגיל."
        },
        snapshot: {

            expenses: "₪8,180",
            balance: "₪4,320"
        },
        attention: [

            { title: "תשלום הלוואת רכב", detail: "ה-5 לחודש הבא", amount: "₪890" },
            { title: "ביטוח דירה — חיוב שנתי", detail: "בעוד 12 יום", amount: "₪640" }
        ],
        recentActivity: [
            { icon: "💰", title: "משכורת", date: "01/07/2026", amount: "₪10,000", type: "income" },
            { icon: "🏡", title: "שכירות", date: "01/07/2026", amount: "-₪3,000", type: "expense" },
            { icon: "🛒", title: "מקרר — תשלום 3 מתוך 10", date: "05/07/2026", amount: "-₪350", type: "expense" },
            { icon: "🏦", title: "הלוואת רכב", date: "05/07/2026", amount: "-₪890", type: "expense" }
        ],
        transactions: [
            { icon: "💰", title: "משכורת", date: "01/07/2026", amount: "₪10,000", type: "income" },
            { icon: "🏡", title: "שכירות", date: "01/07/2026", amount: "-₪3,000", type: "expense" },
            { icon: "🛒", title: "מקרר — תשלום 3 מתוך 10", date: "05/07/2026", amount: "-₪350", type: "expense" },
            { icon: "🏦", title: "הלוואת רכב", date: "05/07/2026", amount: "-₪890", type: "expense" },
            { icon: "📅", title: "ביטוח דירה", date: "10/07/2026", amount: "-₪640", type: "expense" },
            { icon: "💳", title: "מנוי חדר כושר", date: "12/07/2026", amount: "-₪200", type: "expense" },
            { icon: "💰", title: "הכנסה נוספת — פרילנס", date: "18/07/2026", amount: "₪1,500", type: "income" }
        ],
        insights: [
            { title: "סך חיובי כרטיס אשראי החודש", value: "₪2,150", note: "מבוסס על הוצאות קבועות שסומנו ככרטיס אשראי.", tone: "normal" },
            { title: "יתרת הלוואות שנותרו", value: "₪14,200", note: "16 תשלומים נותרו עד סיום ההלוואות הפעילות.", tone: "normal" },
            { title: "אזהרת תחזית", value: "יתרה שלילית אפשרית", note: "התחזית ל-3 חודשים קדימה מצביעה על חודש עם יתרה שלילית.", tone: "warning" }
        ],
        categories: [
            { icon: "💰", label: "הכנסות" },
            { icon: "🏡", label: "הוצאות קבועות" },
            { icon: "🛒", label: "תשלומים שונים" },
            { icon: "🏦", label: "הלוואות" }
        ]
    };

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    function renderTxList(containerId, list) {
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var t = list[i];
            html += '<div class="tx-row">' +
                '<div class="tx-icon">' + t.icon + '</div>' +
                '<div class="tx-info">' +
                    '<div class="tx-title">' + escapeHtml(t.title) + '</div>' +
                    '<div class="tx-date">' + escapeHtml(t.date) + '</div>' +
                '</div>' +
                '<div class="tx-amount ' + t.type + '">' + escapeHtml(t.amount) + '</div>' +
            '</div>';
        }
        document.getElementById(containerId).innerHTML = html;
    }

    // =====================================================================================
    // ===== Stage G.2.4/G.2.5/G.2.6: Transactions-only row-actions markup + wiring.          =====
    // ===== renderTxListWithActions() is a self-contained sibling of renderTxList() above     =====
    // ===== (that function is completely untouched) — Home's recent-activity-list keeps using =====
    // ===== plain renderTxList() exclusively, per the approved "⋮ menu on Transactions screen =====
    // ===== only" decision. toggleRowMenu()/handleRowMenuAction() (both defined further below,=====
    // ===== after archivePreviewItem()/unarchivePreviewItem()) are called via `this`-based     =====
    // ===== onclick — the item id travels only through the data-item-id attribute, never       =====
    // ===== concatenated into an onclick string. Only Stage G.2.6 connects this function to     =====
    // ===== renderTransactionsScreenFromRealData() (see that function below) and only Stage     =====
    // ===== G.2.6 gives the single action item a real onclick — no edit/delete affordance is    =====
    // ===== added anywhere.                                                                     =====
    // =====================================================================================

    function renderTxListWithActions(containerId, txItems) {
        var html = '';
        for (var i = 0; i < txItems.length; i++) {
            var t = txItems[i];

            // Stage G.4: if this row's item is the one currently being edited, its normal
            // .tx-row markup (icon/title/date/amount/⋮ menu) is replaced entirely by the inline
            // edit form (product decision 2א). The full raw item (not the trimmed
            // mapItemToHomeTxRow() shape `t`) is looked up fresh from the live `items` array —
            // same "never trust the previously-rendered shape, re-derive from the live array"
            // convention already used by handleRowMenuAction()/handleDeleteMenuAction() — so the
            // form always reflects the item's current in-memory state. A missing item (deleted by
            // another path between render and this lookup) simply falls through to the normal row
            // below rather than rendering a form for nothing.
            if (previewEditingId !== null && t.id === previewEditingId) {
                var editIdx = items.findIndex(function (it) { return it.id === t.id; });
                if (editIdx !== -1) {
                    html += buildPreviewEditFormHtml(items[editIdx]);
                    continue;
                }
            }

            // Reuses id/isArchived already added to mapItemToHomeTxRow()'s return shape in Stage
            // G.2.1 — no new data source, no new computation. actionLabel is the only new value
            // derived here, and it depends on nothing but that existing isArchived field.
            var actionLabel = t.isArchived ? 'שחזר' : 'העבר לארכיון';
            // Same escapeHtml() already used for every other user-derived string in this file
            // (title/date/amount below, unchanged from renderTxList()) — applied here to the id
            // (defensively, even though it is always numeric in practice) and to the aria-label,
            // since both are injected into HTML attributes. No raw id is ever placed inside an
            // onclick or any JS string — data-item-id is the only place it appears, as plain
            // attribute text, exactly as required.
            var safeId = escapeHtml(String(t.id));
            // Version 1.1, Stage 4.0.2.1: the "✏️ עריכה" dropdown item is removed entirely — the
            // row itself is now the edit trigger (see rowOpenAttrs below). Editing is still only
            // available for active items (same "product decision 1א" restriction this dropdown
            // item used to enforce by simply not existing for archived rows) — that restriction
            // now lives in rowOpenAttrs instead: an archived row gets no onclick/tabindex/pointer
            // cursor at all, so it is neither clickable nor keyboard-focusable as an edit trigger,
            // exactly as before.
            //
            // handleTxRowClick()'s own first line bails out (no-op) when the click actually
            // originated inside .tx-menu-toggle or .tx-menu-dropdown (the same closest()-based
            // check the existing document-level "close other row menus" listener already uses) —
            // so ⋮/archive/restore/delete keep working completely unchanged, with no stopPropagation
            // needed anywhere: those buttons' own onclick handlers still fire first regardless, and
            // the row-level handler simply recognizes their origin and does nothing further.
            var rowOpenAttrs = t.isArchived ? '' :
                ' class="tx-row tx-row-clickable" tabindex="0" role="button" aria-label="' + escapeHtml('ערוך תנועה: ' + t.title) + '" onclick="handleTxRowClick(event, ' + t.id + ')" onkeydown="handleTxRowKeydown(event, ' + t.id + ')"';
            html += '<div' + (rowOpenAttrs || ' class="tx-row"') + '>' +
                '<div class="tx-icon">' + t.icon + '</div>' +
                '<div class="tx-info">' +
                    '<div class="tx-title">' + escapeHtml(t.title) + '</div>' +
                    '<div class="tx-date">' + escapeHtml(t.date) + '</div>' +
                '</div>' +
                '<div class="tx-amount ' + t.type + '">' + escapeHtml(t.amount) + '</div>' +
                '<button type="button" class="tx-menu-toggle" data-item-id="' + safeId + '" aria-label="' + escapeHtml('פעולות עבור ' + t.title) + '" onclick="toggleRowMenu(this)">⋮</button>' +
                '<div class="tx-menu-dropdown">' +
                    '<button type="button" class="tx-menu-item" data-item-id="' + safeId + '" onclick="handleRowMenuAction(this)">' + escapeHtml(actionLabel) + '</button>' +
                    // Stage G.3: second, destructive menu item — same data-item-id-only wiring
                    // convention as the button above (id never enters a concatenated onclick
                    // string), routed to its own handler (handleDeleteMenuAction) further below
                    // rather than handleRowMenuAction(), which stays archive/restore-only.
                    '<button type="button" class="tx-menu-item tx-menu-item-danger" data-item-id="' + safeId + '" onclick="handleDeleteMenuAction(this)">' + escapeHtml('מחק לצמיתות') + '</button>' +
                '</div>' +
            '</div>';
        }
        document.getElementById(containerId).innerHTML = html;
    }

    function renderMockUI() {
        document.getElementById('hero-amount').textContent = MOCK_DATA.hero.amount;
        document.getElementById('hero-status').textContent = MOCK_DATA.hero.statusLabel;

        document.getElementById('snapshot-income').textContent = MOCK_DATA.snapshot.income;
        document.getElementById('snapshot-expenses').textContent = MOCK_DATA.snapshot.expenses;

        // attention-list is no longer rendered from MOCK_DATA.attention here — see Stage E.3's
        // renderAttentionListFromRealData() below, which renders it from real getBiggestUpcoming
        // Charge()/getForecastWarning() results instead. This function no longer reads
        // MOCK_DATA.attention at all.

        renderTxList('recent-activity-list', MOCK_DATA.recentActivity);
        // transactions-list is no longer rendered from MOCK_DATA.transactions here — see Stage
        // E.2's renderTransactionsScreenFromRealData() below, which renders it from real `items`
        // instead. This function no longer reads MOCK_DATA.transactions at all.

        var insightsHtml = '';
        for (var k = 0; k < MOCK_DATA.insights.length; k++) {
            var ins = MOCK_DATA.insights[k];
            var isWarning = ins.tone === 'warning';
            var toneClass = isWarning ? ' warning' : '';
            var toneIcon = isWarning ? '⚠️' : '📊'; // purely visual, derived from the existing tone field
            insightsHtml += '<div class="insight-card' + toneClass + '">' +
                '<div class="insight-icon">' + toneIcon + '</div>' +
                '<div class="insight-body">' +
                    '<div class="insight-title">' + escapeHtml(ins.title) + '</div>' +
                    '<div class="insight-value">' + escapeHtml(ins.value) + '</div>' +
                    '<div class="insight-note">' + escapeHtml(ins.note) + '</div>' +
                '</div>' +
            '</div>';
        }
        document.getElementById('insights-feed').innerHTML = insightsHtml;

        // category-list is no longer rendered from MOCK_DATA.categories here — see Stage E.1's
        // renderSettingsScreenFromRealData() below, which renders it from the real categoryConfig
        // instead. This function no longer reads MOCK_DATA.categories at all.
    }

    // ===== Screen navigation (UI state only) =====
    function showScreen(name) {
        var screens = document.querySelectorAll('.screen');
        for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
        document.getElementById('screen-' + name).classList.add('active');

        var navBtns = document.querySelectorAll('.nav-btn');
        for (var j = 0; j < navBtns.length; j++) { navBtns[j].classList.remove('active'); }
        document.getElementById('nav-' + name).classList.add('active');

        updateFabVisibility();
    }

    // Version 1.1, Stage 3: a category is now a full "page" (the Transactions screen filtered by
    // currentCategoryFilterKey) — the floating + button is scoped to that page only, per the
    // approved product decision. True only while actually looking at an open category page; false
    // on Home, Settings/category-management, Insights, and the plain (unfiltered) Transactions
    // screen.
    function isOnCategoryPage() {
        var txScreenEl = document.getElementById('screen-transactions');
        return !!(txScreenEl && txScreenEl.classList.contains('active') && currentCategoryFilterKey !== null && categoryConfig[currentCategoryFilterKey]);
    }

    function updateFabVisibility() {
        var fabEl = document.getElementById('fab-button');
        if (fabEl) { fabEl.style.display = isOnCategoryPage() ? 'flex' : 'none'; }
    }

    // ===== Transactions filter toggle — visual only, does not filter the mock list =====
    function setTxFilter(name) {
        var btns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
        document.getElementById('filter-' + name).classList.add('active');

        // Stage E.2: the filter is now functional — re-renders transactions-list for the real
        // items matching the selected filter. Previously this function only toggled the button's
        // CSS class and never touched the list itself. renderTransactionsScreenFromRealData() is
        // defined later in this file (function declarations are hoisted, so the forward reference
        // here is safe — same pattern already used throughout this file).
        renderTransactionsScreenFromRealData(name);
    }

    // ===== Quick actions sheet open/close (visual only — no save logic yet) =====
    function toggleQuickActions(forceState) {
        var overlay = document.getElementById('quick-actions-overlay');
        var isOpen = overlay.classList.contains('open');
        var shouldOpen = (typeof forceState === 'boolean') ? forceState : !isOpen;
        if (shouldOpen) { overlay.classList.add('open'); } else { overlay.classList.remove('open'); }
    }

    // Version 1.1, Stage 2: the single FAB now has two behaviors depending on context. While
    // actually looking at a category's filtered transaction list (Transactions screen +
    // currentCategoryFilterKey set — i.e. a "category view"), it skips the generic Quick Actions

    var mockItems = [

    // Ready-made Mock snapshot values (income/expenses/balance). Used by Stage C's getMonthSnapshot()
