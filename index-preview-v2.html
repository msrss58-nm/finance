<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyFinance — Cockpit (Preview v2)</title>
<style>
    :root {
        --color-bg: #f4f5f7;
        --color-surface: #ffffff;
        --color-border: #e5e7eb;
        --color-text: #16181d;
        --color-text-muted: #6b7280;
        --color-primary: #0a7d3d;
        --color-primary-dark: #066b32;
        --color-danger: #c0392b;
        --color-warning: #b45309;
        --color-warning-bg: #fef3e2;
        --color-primary-bg: #eaf7ef;
        --radius: 14px;
        --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; }

    body {
        font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        margin: 0;
    }

    .app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background: var(--color-bg);
        padding-bottom: 130px;
    }

    @media (min-width: 700px) {
        .app-shell { box-shadow: 0 0 40px rgba(0,0,0,.06); }
    }

    /* ===== Header ===== */
    .app-header {
        padding: 22px 20px 14px;
        text-align: center;
    }
    .app-header h1 { font-size: 19px; margin: 0; }
    .app-header .subtitle { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; }

    /* ===== Screens ===== */
    .screen { display: none; padding: 4px 16px 16px; }
    .screen.active { display: block; }

    .section-title { font-size: 15px; font-weight: 700; margin: 22px 0 11px; letter-spacing: -.1px; }
    .section-title:first-child { margin-top: 4px; }

    /* ===== Hero gauge ===== */
    .hero-gauge {
        background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
        color: #fff;
        border-radius: var(--radius);
        padding: 26px 20px;
        text-align: center;
        box-shadow: var(--shadow);
    }
    .hero-gauge .hero-label { font-size: 13px; opacity: .85; }
    .hero-gauge .hero-amount { font-size: 40px; font-weight: 700; margin: 4px 0; }
    .hero-gauge .status-pill {
        display: inline-block; background: rgba(255,255,255,.2);
        padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 4px;
    }
    .hero-gauge .hero-narrative { font-size: 13px; margin-top: 12px; opacity: .92; line-height: 1.6; }

    /* ===== Snapshot ===== */
    .snapshot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .snapshot-card {
        background: var(--color-surface); border-radius: 12px; padding: 12px 6px;
        text-align: center; box-shadow: var(--shadow);
    }
    .snapshot-card .label { font-size: 10.5px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .3px; }
    .snapshot-card .value { font-size: 15px; font-weight: 700; margin-top: 5px; }
    .snapshot-card.income .value { color: var(--color-primary); }
    .snapshot-card.expenses .value { color: var(--color-danger); }

    /* ===== Attention list ===== */
    .attention-item {
        display: flex; justify-content: space-between; align-items: center;
        background: var(--color-warning-bg); border-right: 4px solid var(--color-warning);
        border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    }
    .attention-title { font-size: 13.5px; font-weight: 600; }
    .attention-detail { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
    .attention-amount { font-size: 14px; font-weight: 700; color: var(--color-warning); white-space: nowrap; }

    /* ===== Transaction rows (shared: recent activity + transactions screen) ===== */
    .tx-row {
        display: flex; align-items: center; gap: 12px;
        background: var(--color-surface); border-radius: 12px; padding: 11px 14px;
        margin-bottom: 8px; box-shadow: var(--shadow);
    }
    .tx-icon {
        width: 34px; height: 34px; border-radius: 50%; background: #eef2f0;
        display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
    }
    .tx-info { flex: 1; min-width: 0; }
    .tx-title { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-date { font-size: 11.5px; color: var(--color-text-muted); margin-top: 2px; }
    .tx-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .tx-amount.income { color: var(--color-primary); }
    .tx-amount.expense { color: var(--color-danger); }

    /* ===== Transactions screen: search + filter (visual only) ===== */
    .search-bar input {
        width: 100%; padding: 10px 14px; border: 1px solid var(--color-border);
        border-radius: 10px; font-size: 14px; background: var(--color-surface); font-family: inherit;
    }
    .filter-toggle { display: flex; gap: 8px; margin: 10px 0 16px; }
    .filter-btn {
        flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--color-border);
        background: var(--color-surface); font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .filter-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    /* ===== Insights ===== */
    .insight-card {
        display: flex; align-items: flex-start; gap: 14px;
        background: var(--color-primary-bg); border-radius: 14px; padding: 16px;
        margin-bottom: 12px; box-shadow: var(--shadow); border-right: 4px solid var(--color-primary);
    }
    .insight-card.warning { background: var(--color-warning-bg); border-right-color: var(--color-warning); }
    .insight-icon {
        width: 38px; height: 38px; border-radius: 50%; background: var(--color-surface);
        display: flex; align-items: center; justify-content: center; font-size: 18px;
        flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .insight-body { flex: 1; min-width: 0; }
    .insight-title { font-size: 11.5px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
    .insight-value { font-size: 21px; font-weight: 800; margin-top: 5px; letter-spacing: -.2px; }
    .insight-card.warning .insight-value { color: var(--color-warning); }
    .insight-note { font-size: 12.5px; color: var(--color-text); margin-top: 6px; line-height: 1.55; opacity: .82; }

    /* ===== Settings ===== */
    .category-row {
        display: flex; justify-content: space-between; align-items: center;
        background: var(--color-surface); border-radius: 12px; padding: 12px 14px;
        margin-bottom: 8px; box-shadow: var(--shadow);
    }
    .cat-label { font-size: 14px; }
    .cat-edit { font-size: 12px; color: var(--color-text-muted); }

    .dev-box {
        margin-top: 26px; padding: 16px; border: 1px dashed var(--color-border);
        border-radius: 12px; background: #fafafa;
    }
    .dev-box h3 { font-size: 12.5px; margin: 0 0 8px; color: var(--color-text-muted); font-weight: 600; }
    .status-line { font-size: 12px; color: var(--color-primary); }
    .btn-reset {
        margin-top: 10px; padding: 8px 16px; border: 1px solid var(--color-danger);
        color: var(--color-danger); background: #fff; border-radius: 8px; cursor: pointer;
        font-size: 13px; font-family: inherit;
    }
    .btn-reset:hover { background: #fee; }

    /* ===== Bottom navigation ===== */
    .bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto;
        background: var(--color-surface); border-top: 1px solid var(--color-border);
        display: flex; justify-content: space-around; padding: 8px 0; z-index: 50;
    }
    .nav-btn {
        background: none; border: none; display: flex; flex-direction: column; align-items: center;
        gap: 3px; font-size: 11px; color: var(--color-text-muted); cursor: pointer;
        padding: 4px 10px; font-family: inherit;
    }
    .nav-btn .nav-icon {
        font-size: 18px; padding: 3px 13px; border-radius: 12px;
        transition: background-color .15s ease;
    }
    .nav-btn.active { color: var(--color-primary); font-weight: 700; }
    .nav-btn.active .nav-icon { background: var(--color-primary-bg); }

    /* ===== Floating quick-add button ===== */
    .fab {
        position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
        width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary);
        color: #fff; font-size: 28px; line-height: 1; border: none; box-shadow: 0 6px 16px rgba(0,0,0,.25);
        cursor: pointer; z-index: 60; display: flex; align-items: center; justify-content: center;
    }

    /* ===== Quick actions sheet ===== */
    .quick-actions-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 70; display: none;
    }
    .quick-actions-overlay.open { display: block; }
    .quick-actions-sheet {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 560px; background: var(--color-surface);
        border-radius: 20px 20px 0 0; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    }
    .quick-actions-sheet h3 { margin: 0 0 14px; font-size: 15px; text-align: center; }
    .quick-action-btn {
        width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px;
        border-radius: 12px; border: 1px solid var(--color-border); background: var(--color-bg);
        margin-bottom: 10px; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .quick-action-btn .qa-icon { font-size: 18px; }
    .quick-action-close {
        width: 100%; text-align: center; padding: 10px; background: none; border: none;
        color: var(--color-text-muted); font-size: 13px; margin-top: 4px; cursor: pointer; font-family: inherit;
    }
</style>
</head>
<body>

<div class="app-shell">

    <div class="app-header">
        <h1>FamilyFinance</h1>
        <div class="subtitle">Cockpit — Preview v2 · נתוני Mock בלבד</div>
    </div>

    <!-- ===== מסך 1: בית (Cockpit) ===== -->
    <div class="screen active" id="screen-home">
        <div class="hero-gauge">
            <div class="hero-label">כמה פנוי לי להוציא החודש</div>
            <div class="hero-amount" id="hero-amount"></div>
            <div class="status-pill" id="hero-status"></div>
            <div class="hero-narrative" id="hero-narrative"></div>
        </div>

        <div class="snapshot-grid">
            <div class="snapshot-card income">
                <div class="label">הכנסות</div>
                <div class="value" id="snapshot-income"></div>
            </div>
            <div class="snapshot-card expenses">
                <div class="label">הוצאות</div>
                <div class="value" id="snapshot-expenses"></div>
            </div>
            <div class="snapshot-card">
                <div class="label">יתרה</div>
                <div class="value" id="snapshot-balance"></div>
            </div>
        </div>

        <div class="section-title">מה דורש תשומת לב</div>
        <div id="attention-list"></div>

        <div class="section-title">פעילות אחרונה</div>
        <div id="recent-activity-list"></div>
    </div>

    <!-- ===== מסך 2: תנועות ===== -->
    <div class="screen" id="screen-transactions">
        <div class="section-title" style="margin-top:4px;">תנועות</div>
        <div class="search-bar">
            <input type="text" placeholder="חיפוש תנועה... (לא פעיל בשלב זה)" disabled>
        </div>
        <div class="filter-toggle">
            <button type="button" class="filter-btn active" id="filter-active" onclick="setTxFilter('active')">תנועות פעילות</button>
            <button type="button" class="filter-btn" id="filter-archived" onclick="setTxFilter('archived')">ארכיון</button>
        </div>
        <div id="transactions-list"></div>
    </div>

    <!-- ===== מסך 3: תובנות ===== -->
    <div class="screen" id="screen-insights">
        <div class="section-title" style="margin-top:4px;">תובנות</div>
        <div id="insights-feed"></div>
    </div>

    <!-- ===== מסך 4: הגדרות ===== -->
    <div class="screen" id="screen-settings">
        <div class="section-title" style="margin-top:4px;">ניהול קטגוריות</div>
        <div id="category-list"></div>

        <div class="dev-box">
            <h3>אזור מפתחים — בטיחות נתוני Preview v2</h3>
            <div class="status-line" id="status-line"></div>
            <button type="button" class="btn-reset" onclick="resetPreviewV2Data()">איפוס נתוני Preview v2</button>
        </div>
    </div>

</div>

<!-- ===== ניווט תחתון ===== -->
<div class="bottom-nav">
    <button type="button" class="nav-btn active" id="nav-home" onclick="showScreen('home')">
        <span class="nav-icon">🏠</span><span>בית</span>
    </button>
    <button type="button" class="nav-btn" id="nav-transactions" onclick="showScreen('transactions')">
        <span class="nav-icon">📋</span><span>תנועות</span>
    </button>
    <button type="button" class="nav-btn" id="nav-insights" onclick="showScreen('insights')">
        <span class="nav-icon">💡</span><span>תובנות</span>
    </button>
    <button type="button" class="nav-btn" id="nav-settings" onclick="showScreen('settings')">
        <span class="nav-icon">⚙️</span><span>הגדרות</span>
    </button>
</div>

<!-- ===== כפתור הוספה צף ===== -->
<button type="button" class="fab" onclick="toggleQuickActions()">+</button>

<!-- ===== חלונית פעולות מהירות (חזותי בלבד בשלב זה) ===== -->
<div class="quick-actions-overlay" id="quick-actions-overlay" onclick="toggleQuickActions(false)">
    <div class="quick-actions-sheet" onclick="event.stopPropagation()">
        <h3>הוספת תנועה</h3>
        <button type="button" class="quick-action-btn" onclick="toggleQuickActions(false)">
            <span class="qa-icon">💸</span><span>הוצאה חדשה</span>
        </button>
        <button type="button" class="quick-action-btn" onclick="toggleQuickActions(false)">
            <span class="qa-icon">💰</span><span>הכנסה חדשה</span>
        </button>
        <button type="button" class="quick-action-btn" onclick="toggleQuickActions(false)">
            <span class="qa-icon">🏦</span><span>הלוואה חדשה</span>
        </button>
        <button type="button" class="quick-action-close" onclick="toggleQuickActions(false)">ביטול</button>
    </div>
</div>

<script>
    // ===== Preview v2-only: separate localStorage keys, never touch the real app's data or v1's preview data =====
    // (unchanged from Stage A — same keys, same seed/reset mechanism, only its UI location moved into the Settings screen)
    var PREVIEW_DATA_KEY = 'family_finance_preview_v2_data';
    var PREVIEW_CONFIG_KEY = 'family_finance_preview_v2_cat_config';
    var REAL_DATA_KEY = 'family_finance_data';
    var REAL_CONFIG_KEY = 'family_finance_cat_config';

    var DEFAULT_CATEGORY_CONFIG_JSON = JSON.stringify({
        income: { label: "💰 הכנסות", baseType: "income" },
        fixed: { label: "🏡 הוצאות קבועות", baseType: "fixed" },
        variable: { label: "🛒 תשלומים שונים", baseType: "variable" },
        loan: { label: "🏦 הלוואות", baseType: "loan" }
    });

    (function seedPreviewV2IfNeeded() {
        try {
            if (localStorage.getItem(PREVIEW_DATA_KEY) === null) {
                var realData = localStorage.getItem(REAL_DATA_KEY);
                localStorage.setItem(PREVIEW_DATA_KEY, realData !== null ? realData : '[]');
            }
        } catch (e) { console.log('שגיאה באתחול נתוני Preview v2'); }

        try {
            if (localStorage.getItem(PREVIEW_CONFIG_KEY) === null) {
                var realConfig = localStorage.getItem(REAL_CONFIG_KEY);
                localStorage.setItem(PREVIEW_CONFIG_KEY, realConfig !== null ? realConfig : DEFAULT_CATEGORY_CONFIG_JSON);
            }
        } catch (e) { console.log('שגיאה באתחול תצורת קטגוריות ל-Preview v2'); }
    })();

    function resetPreviewV2Data() {
        if (!confirm('לאפס את נתוני Preview v2 ולהעתיק מחדש את הנתונים מהאפליקציה הראשית? פעולה זו מוחקת רק את עותק ה-Preview v2, לא את הנתונים האמיתיים ולא את נתוני Preview v1.')) return;
        try {
            localStorage.removeItem(PREVIEW_DATA_KEY);
            localStorage.removeItem(PREVIEW_CONFIG_KEY);
        } catch (e) { console.log('שגיאה באיפוס נתוני Preview v2'); }
        location.reload();
    }

    (function reportStatus() {
        var itemCount = 0;
        var catCount = 0;
        try {
            var items = JSON.parse(localStorage.getItem(PREVIEW_DATA_KEY) || '[]');
            itemCount = items.length;
        } catch (e) {}
        try {
            var cfg = JSON.parse(localStorage.getItem(PREVIEW_CONFIG_KEY) || '{}');
            catCount = Object.keys(cfg).length;
        } catch (e) {}
        document.getElementById('status-line').textContent =
            'מפתחות Preview v2 טעונים: ' + itemCount + ' תנועות, ' + catCount + ' קטגוריות (מפתחות אמיתיים לא נגעו).';
    })();

    // ===== Stage B: screen structure + static UI, fed only by MOCK_DATA below. No business logic, no calculations. =====
    var MOCK_DATA = {
        hero: {
            amount: "₪4,320",
            statusLabel: "מצב תקין",
            narrative: "יש לך מרווח בטוח החודש. אפשר להמשיך כרגיל."
        },
        snapshot: {
            income: "₪12,500",
            expenses: "₪8,180",
            balance: "₪4,320"
        },
        attention: [
            { title: "חיוב כרטיס אשראי", detail: "בעוד 4 ימים", amount: "₪2,150" },
            { title: "תשלום הלוואת רכב", detail: "ה-5 לחודש הבא", amount: "₪890" },
            { title: "ביטוח דירה — חיוב שנתי", detail: "בעוד 12 יום", amount: "₪640" }
        ],
        recentActivity: [
            { icon: "💰", title: "משכורת", date: "01/07/2026", amount: "₪10,000", type: "income" },
            { icon: "🏡", title: "שכירות", date: "01/07/2026", amount: "-₪3,000", type: "expense" },
            { icon: "🛒", title: "מקרר — תשלום 3 מתוך 10", date: "05/07/2026", amount: "-₪350", type: "expense" },
            { icon: "🏦", title: "הלוואת רכב", date: "05/07/2026", amount: "-₪890", type: "expense" }
        ],
        transactions: [
            { icon: "💰", title: "משכורת", date: "01/07/2026", amount: "₪10,000", type: "income" },
            { icon: "🏡", title: "שכירות", date: "01/07/2026", amount: "-₪3,000", type: "expense" },
            { icon: "🛒", title: "מקרר — תשלום 3 מתוך 10", date: "05/07/2026", amount: "-₪350", type: "expense" },
            { icon: "🏦", title: "הלוואת רכב", date: "05/07/2026", amount: "-₪890", type: "expense" },
            { icon: "📅", title: "ביטוח דירה", date: "10/07/2026", amount: "-₪640", type: "expense" },
            { icon: "💳", title: "מנוי חדר כושר", date: "12/07/2026", amount: "-₪200", type: "expense" },
            { icon: "💰", title: "הכנסה נוספת — פרילנס", date: "18/07/2026", amount: "₪1,500", type: "income" }
        ],
        insights: [
            { title: "סך חיובי כרטיס אשראי החודש", value: "₪2,150", note: "מבוסס על הוצאות קבועות שסומנו ככרטיס אשראי.", tone: "normal" },
            { title: "יתרת הלוואות שנותרו", value: "₪14,200", note: "16 תשלומים נותרו עד סיום ההלוואות הפעילות.", tone: "normal" },
            { title: "אזהרת תחזית", value: "יתרה שלילית אפשרית", note: "התחזית ל-3 חודשים קדימה מצביעה על חודש עם יתרה שלילית.", tone: "warning" }
        ],
        categories: [
            { icon: "💰", label: "הכנסות" },
            { icon: "🏡", label: "הוצאות קבועות" },
            { icon: "🛒", label: "תשלומים שונים" },
            { icon: "🏦", label: "הלוואות" }
        ]
    };

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    function renderTxList(containerId, list) {
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var t = list[i];
            html += '<div class="tx-row">' +
                '<div class="tx-icon">' + t.icon + '</div>' +
                '<div class="tx-info">' +
                    '<div class="tx-title">' + escapeHtml(t.title) + '</div>' +
                    '<div class="tx-date">' + escapeHtml(t.date) + '</div>' +
                '</div>' +
                '<div class="tx-amount ' + t.type + '">' + escapeHtml(t.amount) + '</div>' +
            '</div>';
        }
        document.getElementById(containerId).innerHTML = html;
    }

    function renderMockUI() {
        document.getElementById('hero-amount').textContent = MOCK_DATA.hero.amount;
        document.getElementById('hero-status').textContent = MOCK_DATA.hero.statusLabel;
        document.getElementById('hero-narrative').textContent = MOCK_DATA.hero.narrative;

        document.getElementById('snapshot-income').textContent = MOCK_DATA.snapshot.income;
        document.getElementById('snapshot-expenses').textContent = MOCK_DATA.snapshot.expenses;
        document.getElementById('snapshot-balance').textContent = MOCK_DATA.snapshot.balance;

        var attentionHtml = '';
        for (var i = 0; i < MOCK_DATA.attention.length; i++) {
            var a = MOCK_DATA.attention[i];
            attentionHtml += '<div class="attention-item">' +
                '<div>' +
                    '<div class="attention-title">' + escapeHtml(a.title) + '</div>' +
                    '<div class="attention-detail">' + escapeHtml(a.detail) + '</div>' +
                '</div>' +
                '<div class="attention-amount">' + escapeHtml(a.amount) + '</div>' +
            '</div>';
        }
        document.getElementById('attention-list').innerHTML = attentionHtml;

        renderTxList('recent-activity-list', MOCK_DATA.recentActivity);
        renderTxList('transactions-list', MOCK_DATA.transactions);

        var insightsHtml = '';
        for (var k = 0; k < MOCK_DATA.insights.length; k++) {
            var ins = MOCK_DATA.insights[k];
            var isWarning = ins.tone === 'warning';
            var toneClass = isWarning ? ' warning' : '';
            var toneIcon = isWarning ? '⚠️' : '📊'; // purely visual, derived from the existing tone field
            insightsHtml += '<div class="insight-card' + toneClass + '">' +
                '<div class="insight-icon">' + toneIcon + '</div>' +
                '<div class="insight-body">' +
                    '<div class="insight-title">' + escapeHtml(ins.title) + '</div>' +
                    '<div class="insight-value">' + escapeHtml(ins.value) + '</div>' +
                    '<div class="insight-note">' + escapeHtml(ins.note) + '</div>' +
                '</div>' +
            '</div>';
        }
        document.getElementById('insights-feed').innerHTML = insightsHtml;

        var catHtml = '';
        for (var m = 0; m < MOCK_DATA.categories.length; m++) {
            var c = MOCK_DATA.categories[m];
            catHtml += '<div class="category-row">' +
                '<div class="cat-label">' + c.icon + ' ' + escapeHtml(c.label) + '</div>' +
                '<div class="cat-edit">עריכה (בקרוב)</div>' +
            '</div>';
        }
        document.getElementById('category-list').innerHTML = catHtml;
    }

    // ===== Screen navigation (UI state only) =====
    function showScreen(name) {
        var screens = document.querySelectorAll('.screen');
        for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
        document.getElementById('screen-' + name).classList.add('active');

        var navBtns = document.querySelectorAll('.nav-btn');
        for (var j = 0; j < navBtns.length; j++) { navBtns[j].classList.remove('active'); }
        document.getElementById('nav-' + name).classList.add('active');
    }

    // ===== Transactions filter toggle — visual only, does not filter the mock list =====
    function setTxFilter(name) {
        var btns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
        document.getElementById('filter-' + name).classList.add('active');
    }

    // ===== Quick actions sheet open/close (visual only — no save logic yet) =====
    function toggleQuickActions(forceState) {
        var overlay = document.getElementById('quick-actions-overlay');
        var isOpen = overlay.classList.contains('open');
        var shouldOpen = (typeof forceState === 'boolean') ? forceState : !isOpen;
        if (shouldOpen) { overlay.classList.add('open'); } else { overlay.classList.remove('open'); }
    }

    renderMockUI();
</script>

</body>
</html>
